<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KBO 타격·투구·수비 지표 리더보드">
  <title>KBO Savant 리더보드</title>
  <link rel="stylesheet" href="leaderboards.css?v=20260901-1">
</head>
<body>
  <main class="leaderboard-page">
    <nav><a href="../">← KBO Savant</a></nav>
    <header>
      <p class="eyebrow">KBO SAVANT</p>
      <h1>리더보드</h1>
      <p>시즌별 타격·투구·수비 지표를 검색하고 정렬할 수 있습니다.</p>
    </header>

    <section class="controls" aria-label="리더보드 필터">
      <label>시즌<select id="season-select"></select></label>
      <label>분류<select id="dataset-select"></select></label>
      <label class="search-label">선수 검색<input id="player-search" type="search" placeholder="선수 이름" autocomplete="off"></label>
      <label>팀<select id="team-select"><option value="">전체</option></select></label>
    </section>

    <section class="table-card" aria-live="polite">
      <div class="table-meta">
        <div><strong id="table-title">리더보드</strong><span id="row-count"></span></div>
        <p>열 제목을 누르면 정렬됩니다.</p>
      </div>
      <div class="table-scroll">
        <table>
          <thead id="leaderboard-head"></thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
      <p id="status" class="status">데이터를 불러오는 중입니다.</p>
    </section>
    <p class="source-note">제공된 시즌별 KBO 통계 자료를 기준으로 표시합니다. 빈 값은 —로 표기합니다.</p>
  </main>
  <script src="leaderboards.js?v=20260901-1"></script>
</body>
</html>
