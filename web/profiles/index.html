<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KBO Swing/Take 프로필</title>
  <link rel="stylesheet" href="profile.css?v=20260822-4">
</head>
<body>
  <main>
    <p class="back"><a href="../index.html">← 선수 검색</a></p>
    <header class="profile-header">
      <p class="eyebrow" id="profile-season">Visual Baseball ABS · KBO</p>
      <h1 id="player-name">선수 프로필</h1>
      <p id="bats"></p>
      <p id="meta">프로필을 불러오는 중입니다.</p>
    </header>
    <section class="profile-card" aria-label="Swing Take 프로필">
      <div class="score-line"><span class="score-label">Run Value</span><strong id="total-run-value">—</strong><span id="score-detail">위치·카운트 중립</span></div>
      <div class="profile-dashboard">
        <section class="zone-panel" aria-label="Zone Run Value">
          <div class="zone-visual" aria-label="Heart, Shadow, Chase, Waste 구역별 Run Value와 스트라이크존">
            <div class="zone-waste"></div><div class="zone-chase"></div><div class="zone-shadow"></div><div class="zone-heart"></div>
            <div class="strike-zone" aria-label="Strike Zone"></div>
            <span class="zone-run-value zone-run-waste"><b id="zone-run-waste">—</b></span>
            <span class="zone-run-value zone-run-chase"><b id="zone-run-chase">—</b></span>
            <span class="zone-run-value zone-run-shadow"><b id="zone-run-shadow">—</b></span>
            <span class="zone-run-value zone-run-heart"><b id="zone-run-heart">—</b></span>
          </div>
          <details class="zone-guide"><summary>전체 구획 기준도 보기</summary><img src="../assets/zone-chart.png" alt="Heart, Shadow, Chase, Waste와 ABS 스트라이크존의 상대 거리 기준도"></details>
        </section>
        <section class="regions-panel" aria-labelledby="regions-title">
          <div class="panel-heading"><h2 id="regions-title">Zone Decisions</h2><p id="pitch-total"></p></div>
          <div class="region-scroll" aria-label="Zone Decisions 표. 모바일에서는 좌우로 밀어 전체 지표를 확인하세요.">
            <div class="region-columns" aria-hidden="true"><span></span><span class="frequency-head">Pitch Frequency<small>(괄호 안은 리그 평균)</small></span><span class="split-head"><span>Swing</span><span>Take</span></span><span>Run Value</span></div>
            <div id="regions" class="region-list"></div>
            <div class="panel-footers">
              <div id="split-legend" class="split-legend"><i></i>League Avg</div>
              <div id="run-total" class="run-total"></div>
            </div>
          </div>
        </section>
      </div>
    </section>
    <p class="method-note">Run Value는 각 투구의 Raw Run Value에서 같은 볼카운트·상대 위치의 리그 평균을 뺀 값입니다. 타자 기준으로 양수일수록 좋습니다.</p>
  </main>
  <script src="profile.js?v=20260822-3"></script>
</body>
</html>
