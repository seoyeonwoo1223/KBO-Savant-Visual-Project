<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swing/Take 프로필</title>
  <link rel="stylesheet" href="profile.css">
</head>
<body>
  <main>
    <header class="profile-header">
      <p class="eyebrow">Visual Baseball ABS · 2026 KBO</p>
      <h1 id="player-name">선수</h1>
      <p id="meta">프로필을 불러오는 중입니다.</p>
    </header>

    <section class="card decision-card" aria-labelledby="decision-title">
      <h2 id="decision-title">Decision Run</h2>
      <div id="summary-stats" class="summary-stats"></div>
      <p class="method-note">투구의 위치와 볼카운트를 중립화한 뒤 남는 의사결정 가치입니다. 타자 기준으로 양수일수록 좋습니다.</p>
    </section>

    <section class="card map-card" aria-labelledby="map-title">
      <h2 id="map-title">Strike-zone decision map</h2>
      <div class="map-layout">
        <div class="zone-map" aria-label="Heart, Shadow, Chase, Waste와 스트라이크존을 나타낸 단일선 지도">
          <div class="zone-200"></div>
          <div class="zone-chase"></div>
          <div class="zone-shadow"></div>
          <div class="zone-heart"></div>
          <div id="zone-grid" class="strike-zone-grid" aria-label="스트라이크존 3x3 Decision Run"></div>
          <div class="zone-label label-200">200%</div>
          <div class="zone-label label-133">133%</div>
          <div class="zone-label label-100">100%</div>
          <div class="zone-label label-67">67%</div>
        </div>
        <div class="map-key" aria-label="구역 경계 설명">
          <p><i class="key-line heart"></i>Heart <span>0–66.7%</span></p>
          <p><i class="key-line shadow"></i>Shadow <span>66.7–133.3%</span></p>
          <p><i class="key-line chase"></i>Chase <span>133.3–200%</span></p>
          <p><i class="key-line waste"></i>Waste <span>&gt;200%</span></p>
        </div>
      </div>
    </section>

    <section class="card attack-card" aria-labelledby="attack-title">
      <h2 id="attack-title">Attack regions</h2>
      <div id="regions" class="region-cards"></div>
    </section>
  </main>
  <script src="profile.js"></script>
</body>
</html>
