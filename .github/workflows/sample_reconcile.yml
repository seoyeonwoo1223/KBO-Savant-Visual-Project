name: Sample historical source check

on:
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visualbaseball-daily-update
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt -c constraints-za.txt
      - run: python -m visualbaseball.cli --collection-mode sample --auto-reconcile --refresh-workers 3
        env:
          PYTHONPATH: src
      - run: |
          git add data web/data exports/visualbaseball_savant_2026_latest.xlsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sample historical source reconciliation"
          git push
