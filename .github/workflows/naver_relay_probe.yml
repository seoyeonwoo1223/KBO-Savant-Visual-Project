name: Probe Naver relay non-pitch events

on:
  push:
    branches:
      - feature/pickoff-runner-pitches
    paths:
      - ".github/workflows/naver_relay_probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pickoff-runner-pitches
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch sample Naver relays
        run: |
          python - <<'PY'
          import json, urllib.request, time
          from pathlib import Path

          games = [
              '20260328HTSK0','20260328KTLG0','20260328LTSS0','20260328OBNC0','20260328WOHH0',
              '20260819KTLG0','20260819WOLT0','20260901KTLG0','20260901HHOB0','20260901NCHT0'
          ]
          base = 'https://api-gw.sports.naver.com'
          records = []
          key_counts = {}
          for game in games:
              gid = f'{game}2026'
              for inn in range(1, 13):
                  url = f'{base}/schedule/games/{gid}/relay?inning={inn}'
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'visualbaseball-savant-probe/1.0'})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          payload = json.loads(r.read().decode('utf-8-sig'))
                  except Exception as e:
                      records.append({'game_id':game,'inning_requested':inn,'fetch_error':repr(e)})
                      break
                  relay = (payload.get('result') or {}).get('textRelayData') or {}
                  text_relays = relay.get('textRelays') or []
                  if not text_relays:
                      if inn >= 9:
                          break
                      continue
                  for pa in text_relays:
                      for opt in pa.get('textOptions') or []:
                          if opt.get('ptsPitchId'):
                              continue
                          text = str(opt.get('text') or '')
                          for k in opt.keys(): key_counts[k] = key_counts.get(k,0)+1
                          records.append({
                              'game_id': game,
                              'inning_requested': inn,
                              'pa_inn': pa.get('inn'),
                              'homeOrAway': pa.get('homeOrAway'),
                              'seqno': opt.get('seqno'),
                              'text': text,
                              'keys': sorted(opt.keys()),
                              'option': opt,
                          })
                  time.sleep(.05)
          pickoff_like = [r for r in records if '견제' in str(r.get('text',''))]
          base_words = ('1루','2루','3루','주자','송구','세이프','아웃')
          runner_like = [r for r in records if any(w in str(r.get('text','')) for w in base_words)]
          out = {
              'games': games,
              'non_pitch_option_count': len([r for r in records if 'option' in r]),
              'pickoff_text_count': len(pickoff_like),
              'key_counts': key_counts,
              'pickoff_options': pickoff_like[:200],
              'runner_like_options': runner_like[:500],
          }
          p=Path('web/data/pickoff/2026/naver_relay_probe.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'non_pitch_option_count':out['non_pitch_option_count'],'pickoff_text_count':out['pickoff_text_count'],'key_counts':out['key_counts']},ensure_ascii=False,indent=2))
          PY
      - name: Commit probe
        run: |
          git add web/data/pickoff/2026/naver_relay_probe.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: inspect Naver relay event schema" || exit 0
          git push origin HEAD:feature/pickoff-runner-pitches
