name: Historical Visual Baseball refresh

on:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to fully re-fetch and reconcile"
        required: true
        default: "2026"
        type: choice
        options: ["2022", "2023", "2024", "2025", "2026"]

permissions:
  contents: write

concurrency:
  group: visualbaseball-daily-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt -c constraints-za.txt
      - run: python -m pytest
      - run: node tests/test_pitch_arsenal_layout.cjs
        env:
          PYTHONPATH: src
      - name: Re-fetch every completed selected-season game
        run: |
          season="${{ inputs.season || '2026' }}"
          if [ "$season" = "2025" ]; then
            python -m visualbaseball.cli --season "$season" --storage-root seasons/2025 --collection-mode reconcile --refresh-workers 3
          else
            python -m visualbaseball.cli --season "$season" --collection-mode reconcile --refresh-workers 3
          fi
        env:
          PYTHONPATH: src
      - name: Publish latest Excel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view visualbaseball-data-latest >/dev/null 2>&1 || gh release create visualbaseball-data-latest --title "Latest KBO Savant data" --notes "Automatically regenerated Excel download."
          gh release upload visualbaseball-data-latest exports/visualbaseball_savant_2026_latest.xlsx --clobber
      - run: |
          git add data web/data
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh completed Visual Baseball games"
          git push
