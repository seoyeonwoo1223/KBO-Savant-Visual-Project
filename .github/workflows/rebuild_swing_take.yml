name: Rebuild 2026 Swing Take profiles

on:
  push:
    branches: [master]
    paths:
      - ".github/profile-refresh-request"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kbo-swing-take-profile-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt -c constraints-za.txt
      - run: python -m pytest
      - run: node tests/test_pitch_arsenal_layout.cjs
        env:
          PYTHONPATH: src
      - run: python -m visualbaseball.cli --refresh-completed
        env:
          PYTHONPATH: src
      - name: Publish latest Excel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view visualbaseball-data-latest >/dev/null 2>&1 || gh release create visualbaseball-data-latest --title "Latest KBO Savant data" --notes "Automatically regenerated Excel download."
          gh release upload visualbaseball-data-latest exports/visualbaseball_savant_2026_latest.xlsx --clobber
      - run: |
          git add data web/data
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: rebuild 2026 Swing Take profiles"
          git push
