name: Inspect Naver runner-event text

on:
  push:
    branches:
      - feature/pickoff-runner-pitches
    paths:
      - ".github/workflows/naver_relay_text_probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe relay text without checkout
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from collections import Counter

          games = [
              '20260328HTSK0','20260328KTLG0','20260328LTSS0','20260328OBNC0','20260328WOHH0',
              '20260819KTLG0','20260819WOLT0','20260901KTLG0','20260901HHOB0','20260901NCHT0'
          ]
          base = 'https://api-gw.sports.naver.com'
          all_nonpitch=[]
          for game in games:
              gid=f'{game}2026'
              for inn in range(1,13):
                  url=f'{base}/schedule/games/{gid}/relay?inning={inn}'
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'visualbaseball-savant-probe/1.0'})
                      with urllib.request.urlopen(req,timeout=20) as r:
                          payload=json.loads(r.read().decode('utf-8-sig'))
                  except Exception:
                      break
                  relays=((payload.get('result') or {}).get('textRelayData') or {}).get('textRelays') or []
                  if not relays and inn>=9:
                      break
                  for pa in relays:
                      for opt in pa.get('textOptions') or []:
                          if not opt.get('ptsPitchId'):
                              all_nonpitch.append((str(opt.get('type')),str(opt.get('text') or '').strip()))
          keywords=('견제','송구','주자','1루','2루','3루')
          relevant=[x for x in all_nonpitch if any(k in x[1] for k in keywords)]
          print('TOTAL_NONPITCH',len(all_nonpitch))
          print('TYPE_COUNTS',json.dumps(Counter(t for t,_ in all_nonpitch),ensure_ascii=False))
          print('RELEVANT_COUNT',len(relevant))
          for (typ,text),count in Counter(relevant).most_common(300):
              print(f'{count}\tTYPE={typ}\t{text}')
          PY
