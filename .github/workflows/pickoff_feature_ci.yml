name: Pickoff feature validation

on:
  push:
    branches:
      - feature/pickoff-runner-pitches
    paths:
      - "src/visualbaseball/naver.py"
      - "src/visualbaseball/pickoff.py"
      - "src/visualbaseball/collector.py"
      - "src/visualbaseball/cli.py"
      - "tests/test_pickoff.py"
      - ".github/workflows/pickoff_feature_ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt -c constraints-za.txt
      - run: PYTHONPATH=src python -m pytest tests/test_pickoff.py tests/test_collector.py
