name: 2026 Pickoff Backfill

on:
  push:
    branches:
      - feature/pickoff-runner-pitches
    paths:
      - ".github/workflows/pickoff_backfill.yml"

permissions:
  contents: write

concurrency:
  group: pickoff-backfill-2026
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pickoff-runner-pitches
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt -c constraints-za.txt
      - name: Run full 2026 Naver pickoff backfill
        run: python -m visualbaseball.cli --season 2026 --backfill-pickoffs --naver-workers 6
      - name: Print team summary
        run: cat web/data/pickoff/2026/team_summary.json
      - name: Commit generated pickoff outputs
        run: |
          git add web/data/pickoff/2026/team_summary.json
          git add data/metrics/pickoff/2026/team_summary.parquet
          git add data/curated/pickoffs/season=2026/events.parquet
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: backfill 2026 pickoff rates"
          git push origin HEAD:feature/pickoff-runner-pitches
