name: Pickoff event audit

on:
  push:
    branches:
      - feature/pickoff-runner-pitches
    paths:
      - ".github/workflows/pickoff_audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pickoff-runner-pitches
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyarrow
      - name: Build audit JSON
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          import pyarrow.parquet as pq

          p = Path('data/curated/pickoffs/season=2026/events.parquet')
          rows = pq.read_table(p).to_pylist()
          texts = [str(r.get('description') or '') for r in rows]
          by_base = Counter(str(r.get('pickoff_base') or 'unknown') for r in rows)
          by_text = Counter(texts)
          payload = {
              'event_count': len(rows),
              'games_with_pickoff_event': len({r.get('game_id') for r in rows}),
              'pickoff_out_count': sum(bool(r.get('is_pickoff_out')) for r in rows),
              'pickoff_error_count': sum(bool(r.get('is_pickoff_error')) for r in rows),
              'routine_no_out_or_error_count': sum(not bool(r.get('is_pickoff_out')) and not bool(r.get('is_pickoff_error')) for r in rows),
              'by_base': dict(sorted(by_base.items())),
              'top_descriptions': [{'text': t, 'count': n} for t, n in by_text.most_common(100)],
              'sample_events': rows[:100],
          }
          out = Path('web/data/pickoff/2026/audit.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
      - name: Commit audit
        run: |
          git add web/data/pickoff/2026/audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: audit 2026 pickoff events" || exit 0
          git push origin HEAD:feature/pickoff-runner-pitches
