name: Daily Visual Baseball update

on:
  push:
    paths:
      - "exports/visualbaseball_savant_2026_latest.xlsx"
      - "src/visualbaseball/**"
      - "data/park_adjustments/**"
      - "web/profiles/**"
      - "web/zones/**"
      - "web/pitch-arsenal/**"
      - "requirements.txt"
      - ".github/workflows/daily_update.yml"
      - ".github/refresh-completed-request"
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      refresh_completed:
        description: "Re-fetch every completed game before rebuilding Swing/Take profiles"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: visualbaseball-daily-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pytest
        env:
          PYTHONPATH: src
      - name: Check whether the blocking-data backfill is required
        id: blocking_backfill
        run: |
          python - <<'PY'
          import os

          import pyarrow.parquet as pq

          required = {"catcher_id", "catcher_name", "is_wild_pitch", "is_passed_ball", "naver_match_status"}
          try:
              schema = set(pq.read_schema("data/processed/pitches.parquet").names)
              if not required.issubset(schema):
                  raise ValueError("blocking columns are absent")
              statuses = pq.read_table(
                  "data/processed/pitches.parquet", columns=["naver_match_status"]
              ).column("naver_match_status").to_pylist()
              confirmed = sum(status in {"matched", "record_no_event"} for status in statuses)
              coverage = confirmed / len(statuses) if statuses else 0.0
          except (FileNotFoundError, OSError):
              coverage = 0.0
          except ValueError:
              coverage = 0.0
          needs_backfill = coverage < 0.95
          print(f"Confirmed Naver WP/PB coverage: {coverage:.1%}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"required={str(needs_backfill).lower()}\n")
          PY
      - name: Update Visual Baseball data
        run: |
          if [ "${{ steps.blocking_backfill.outputs.required }}" = "true" ]; then
            python -m visualbaseball.cli --rebuild-from-raw --refresh-naver --naver-workers 10
          elif [ -f .github/refresh-completed-request ]; then
            python -m visualbaseball.cli --refresh-completed --refresh-workers 3
          else
            python -m visualbaseball.cli ${{ inputs.refresh_completed == true && '--refresh-completed' || '' }}
          fi
        env:
          PYTHONPATH: src
      - name: Rebuild all Pitch Arsenal seasons
        run: |
          for season in 2022 2023 2024 2025 2026; do
            python -c "from pathlib import Path; from visualbaseball.pitch_arsenal import build_pitch_arsenal; build_pitch_arsenal(Path('.'), ${season})"
          done
        env:
          PYTHONPATH: src
      - run: |
          git add data web/data exports/visualbaseball_savant_2026_latest.xlsx exports/plate_discipline_research_2026.csv exports/kbo_zone_awareness_v2_2026.csv
          if [ -f .github/refresh-completed-request ]; then
            git rm .github/refresh-completed-request
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Visual Baseball data"
          git pull --rebase origin master
          git push
      - name: Print failure diagnostics
        if: failure()
        run: |
          git status --short
          git log -1 --oneline
