name: Daily Visual Baseball update

on:
  schedule:
    # 12:07 Asia/Seoul (UTC+9)
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visualbaseball-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pytest
        env:
          PYTHONPATH: src
      - run: python -m visualbaseball.cli
        env:
          PYTHONPATH: src
      - run: |
          git add data web/data exports/visualbaseball_savant_2026_latest.xlsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Visual Baseball data"
          git push
      - name: Print failure diagnostics
        if: failure()
        run: |
          git status --short
          git log -1 --oneline
