name: Daily Visual Baseball update

on:
  push:
    branches: [master]
    # 산출물을 바꿀 수 있는 입력만 둡니다. web/**는 출력물이고 어떤 코드도 입력으로
    # 읽지 않으므로(docs/curated-data.md의 핵심 계약) 뷰 수정은 여기 걸리지 않습니다.
    paths:
      - "src/visualbaseball/**"
      - "data/park_adjustments/**"
      - "requirements.txt"
      - "constraints-za.txt"
      - ".github/workflows/daily_update.yml"
      - ".github/refresh-completed-request"
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      refresh_completed:
        description: "Re-fetch every completed game before rebuilding Swing/Take profiles"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: visualbaseball-daily-update
  # 실행을 취소하지 않고 순서대로 돌립니다. 코드 push가 만든 재계산 실행이 예약
  # 실행에 취소되면, 네트워크 수집이 90분 제한에 걸리는 날 새 산식이 게시되지
  # 않습니다. GitHub는 그룹당 대기 실행을 하나만 두므로 대기열이 쌓이지 않습니다.
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt -c constraints-za.txt
      - run: python -m pytest
      - run: node tests/test_pitch_arsenal_layout.cjs
      - run: python scripts/check_metric_state.py
      - name: Update Visual Baseball data
        # 새 경기 수집은 명시적으로 의도한 실행에서만 합니다 — 스케줄, 수동 실행,
        # refresh-completed-request 커밋. parser·상태 전이·canonical 변환·Naver
        # 보강 코드 push는 보존 원본을 다시 처리하고, 나머지는 산출물만 만듭니다.
        run: |
          if [ -f .github/refresh-completed-request ]; then
            python -m visualbaseball.cli --refresh-completed --refresh-workers 3
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            git fetch --no-tags --depth=1 origin "$base" || true
            if ! git cat-file -e "$base^{commit}" 2>/dev/null \
              || ! git diff --quiet "$base" "${{ github.sha }}" -- \
                src/visualbaseball/parser.py \
                src/visualbaseball/state_machine.py \
                src/visualbaseball/validation.py \
                src/visualbaseball/collector.py \
                src/visualbaseball/storage.py \
                src/visualbaseball/curated.py \
                src/visualbaseball/naver.py; then
              python -m visualbaseball.cli --rebuild-from-raw --refresh-naver --naver-workers 3
            else
              python -m visualbaseball.cli --exports-only
            fi
          else
            python -m visualbaseball.cli ${{ inputs.refresh_completed == true && '--refresh-completed' || '' }}
          fi
      - name: Rebuild ZA for completed ABS seasons
        # 2024·2025는 새로 수집하지 않습니다. metric_state의 입력·코드 hash가 바뀐
        # 경우에만 저장된 curated 데이터로 ZA/SBJ를 다시 계산하고, 평소에는 확인만 합니다.
        run: |
          for season in 2024 2025; do
            python -m visualbaseball.cli --season "$season" --only zone_decision
          done
      - name: Check ZA seasons agree before publishing
        # Release 업로드·데이터 커밋(그리고 그 뒤 Pages 배포)보다 앞에 둡니다.
        # 실패하면 어떤 공개 산출물도 교체되지 않습니다.
        run: python scripts/check_zone_decision_outputs.py
      - name: Publish latest Excel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view visualbaseball-data-latest >/dev/null 2>&1 || gh release create visualbaseball-data-latest --title "Latest KBO Savant data" --notes "Automatically regenerated Excel download."
          gh release upload visualbaseball-data-latest exports/visualbaseball_savant_2026_latest.xlsx --clobber
      - run: |
          git add exports/zone_decision_players_2024.csv exports/zone_decision_players_2025.csv exports/zone_decision_players_2026.csv
          git add data web/data exports/plate_discipline_research_2026.csv exports/plate_decision_v1_players_2026.csv exports/plate_decision_v1_movement_comparison_2026.csv exports/plate_decision_v1_outliers_2026.csv
          if [ -f .github/refresh-completed-request ]; then
            git rm .github/refresh-completed-request
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Visual Baseball data"
          git pull --rebase origin master
          git push
      - name: Print failure diagnostics
        if: failure()
        run: |
          git status --short
          git log -1 --oneline
