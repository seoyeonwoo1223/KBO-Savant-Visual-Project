name: Harness checks

# 하네스 센서 (docs/harness/feedback.md): 웹 페이지 공통 규격, 웹 렌더 함수 테스트(.cjs), 문서 링크.
# 배포(deploy-pages)를 막지는 않고, 규격이 깨지면 이 체크만 빨간색이 됩니다.
on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "scripts/web_contract.py"
      - "scripts/new_web_tool.py"
      - "tests/test_web_contract.py"
      - "tests/*.cjs"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "docs/**"
      - ".github/workflows/web_contract.yml"
  pull_request:
    paths:
      - "web/**"
      - "scripts/web_contract.py"
      - "scripts/new_web_tool.py"
      - "tests/test_web_contract.py"
      - "tests/*.cjs"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "docs/**"
      - ".github/workflows/web_contract.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/web_contract.py
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_web_contract.py tests/test_docs_links.py
      # 웹 렌더 함수 센서 (.cjs는 pytest가 수집하지 않음). 새 .cjs를 추가하면 자동으로 포함됩니다.
      - run: for test in tests/*.cjs; do node "$test" || exit 1; done
